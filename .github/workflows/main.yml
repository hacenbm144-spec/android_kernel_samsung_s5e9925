name: Build ExtremeKRNL (b0s)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git libelf-dev libncurses5-dev libssl-dev \
            lzop python3 zip zlib1g-dev

      - name: Setup Clang toolchain (ZyC Clang 17)
        run: |
          mkdir -p $HOME/toolchain/clang
          curl -L "https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230322-release/Clang-17.0.0-20230322.tar.gz" \
            -o clang.tar.gz
          tar -xf clang.tar.gz -C $HOME/toolchain/clang
          echo "$HOME/toolchain/clang/bin" >> $GITHUB_PATH

      - name: Build kernel
        run: |
          export PATH="$HOME/toolchain/clang/bin:$PATH"

          # Generate config: base defconfig + b0s device fragment
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            s5e9925_defconfig

          # Merge b0s device fragment
          ./scripts/kconfig/merge_config.sh -m -O out \
            out/.config \
            arch/arm64/configs/b0s.config

          # Enable BBR TCP congestion control
          echo "CONFIG_TCP_CONG_BBR=y"            >> out/.config
          echo 'CONFIG_DEFAULT_TCP_CONG="bbr"'    >> out/.config
          echo "CONFIG_NET_SCH_FQ=y"              >> out/.config
          # Enable TCP Fast Open
          echo "CONFIG_TCP_FASTOPEN=y"            >> out/.config
          # Enable WireGuard
          echo "CONFIG_WIREGUARD=y"               >> out/.config
          # Enable ZRAM with zstd
          echo "CONFIG_ZRAM=y"                    >> out/.config
          echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y"     >> out/.config
          echo "CONFIG_CRYPTO_ZSTD=y"             >> out/.config

          # Finalise config
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KBUILD_BUILD_USER=hacenbm144 \
            KBUILD_BUILD_HOST=ExtremeKRNL-b0s \
            olddefconfig

          # Build
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KBUILD_BUILD_USER=hacenbm144 \
            KBUILD_BUILD_HOST=ExtremeKRNL-b0s \
            -j$(nproc --all) 2>&1 | tee build.log

      - name: Check build output
        run: |
          if [ -f out/arch/arm64/boot/Image ]; then
            echo "✅ Kernel Image built successfully"
            ls -lh out/arch/arm64/boot/Image
          else
            echo "❌ Build failed - Image not found"
            echo "--- Contents of out/arch/arm64/boot/ ---"
            ls out/arch/arm64/boot/ 2>/dev/null || echo "(empty)"
            tail -80 build.log
            exit 1
          fi

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/hacenbm144-spec/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          # Copy DTBs if present
          find out/arch/arm64/boot/dts -name "*.dtb" \
            -exec cp {} AnyKernel3/dtbs/ \; 2>/dev/null || true
          [ -f out/arch/arm64/boot/dtb.img ] && \
            cp out/arch/arm64/boot/dtb.img AnyKernel3/ || true
          cd AnyKernel3
          zip -r9 ../ExtremeKRNL-b0s-BBR-$(date +%Y%m%d-%H%M).zip . -x '*.git*'

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-b0s-BBR
          path: ExtremeKRNL-b0s-BBR-*.zip
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
