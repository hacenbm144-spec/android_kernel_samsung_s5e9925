name: Build tcp_bbr.ko v1.6
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          fetch-depth: 1
      - name: Install dependencies
        run: sudo apt-get update -y && sudo apt-get install -y bc bison build-essential curl flex git libelf-dev libncurses5-dev libssl-dev python3 zip zlib1g-dev
      - name: Setup Clang r596125
        run: |
          mkdir -p $HOME/toolchain/clang
          curl -L "https://storage.googleapis.com/android-toolbox-public/clang-r596125-linux-x86-64.tar.gz" -o clang.tar.gz && tar -xf clang.tar.gz -C $HOME/toolchain/clang --strip-components=1 || true
          if [ ! -f $HOME/toolchain/clang/bin/clang ]; then
            echo "Falling back to Clang 17..."
            curl -L "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz" -o clang.tar.xz
            tar -xf clang.tar.xz --strip-components=1 -C $HOME/toolchain/clang
          fi
          echo "$HOME/toolchain/clang/bin" >> $GITHUB_PATH
          $HOME/toolchain/clang/bin/clang --version
      - name: Generate config
        run: |
          export PATH="$HOME/toolchain/clang/bin:$PATH"
          make O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- s5e9925_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/b0s.config
          make O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- KBUILD_BUILD_USER=alienware-cachy KBUILD_BUILD_HOST=alienwarecachy-g33500 olddefconfig
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> out/.config
          echo "CONFIG_TCP_CONG_BBR=m" >> out/.config
          echo "CONFIG_MODULES=y" >> out/.config
          echo "CONFIG_MODULE_UNLOAD=y" >> out/.config
          echo "CONFIG_NET_SCH_FQ=y" >> out/.config
          echo "CONFIG_NET_SCH_FQ_CODEL=y" >> out/.config
          echo 'CONFIG_LOCALVERSION="-ExtremeKRNL-v1.6+"' >> out/.config
          echo 'CONFIG_LOCALVERSION_AUTO=n' >> out/.config
          make O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- KBUILD_BUILD_USER=alienware-cachy KBUILD_BUILD_HOST=alienwarecachy-g33500 olddefconfig
          grep -E "TCP_CONG_BBR|LOCALVERSION|MODVERSIONS|^CONFIG_MODULES=" out/.config
      - name: Build modules
        run: |
          export PATH="$HOME/toolchain/clang/bin:$PATH"
          make O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- KBUILD_BUILD_USER=alienware-cachy KBUILD_BUILD_HOST=alienwarecachy-g33500 KERNELRELEASE=5.10.252-ExtremeKRNL-v1.6+ -j$(nproc --all) modules 2>&1 | tee build.log
      - name: Patch CRCs and package
        run: |
          find out -name "tcp_bbr.ko" 2>/dev/null
          if [ ! -f out/net/ipv4/tcp_bbr.ko ]; then echo "FAILED"; tail -50 build.log; exit 1; fi
          echo "SUCCESS - patching CRCs..."
          python3 << 'PYEOF'
          import struct
          data = bytearray(open('out/net/ipv4/tcp_bbr.ko','rb').read())
          fixes = {
              'module_layout': 0x7c24b32d,
              'tcp_register_congestion_control': 0x830d1ca5,
              'tcp_unregister_congestion_control': 0x227ff6bd,
              'jiffies': 0x15ba50a6,
              '__warn_printk': 0x56470118,
              '__stack_chk_fail': 0x98a9d10c,
              'cpu_hwcap_keys': 0xec2fc692,
              'arm64_const_caps_ready': 0x14b89635,
              'minmax_running_max': 0xb911bb58,
              'prandom_u32': 0xfda9581f,
          }
          shoff=struct.unpack_from('<Q',data,40)[0]
          shentsize=struct.unpack_from('<H',data,58)[0]
          shnum=struct.unpack_from('<H',data,60)[0]
          shstrndx=struct.unpack_from('<H',data,62)[0]
          st=struct.unpack_from('<Q',data,shoff+shstrndx*shentsize+24)[0]
          for i in range(shnum):
              sh=shoff+i*shentsize
              shn=struct.unpack_from('<I',data,sh)[0]
              sho=struct.unpack_from('<Q',data,sh+24)[0]
              shs=struct.unpack_from('<Q',data,sh+32)[0]
              e=data.find(b'\x00',st+shn)
              n=data[st+shn:e].decode('ascii',errors='ignore')
              if n=='__versions':
                  for j in range(shs//64):
                      o=sho+j*64
                      s=data[o+4:o+64].rstrip(b'\x00').decode('ascii',errors='ignore')
                      if s in fixes:
                          old=struct.unpack_from('<I',data,o)[0]
                          struct.pack_into('<I',data,o,fixes[s])
                          print('Fixed '+s+': 0x'+format(old,'08x')+' -> 0x'+format(fixes[s],'08x'))
                  break
          open('out/net/ipv4/tcp_bbr.ko','wb').write(data)
          print('CRC patching done!')
          PYEOF
          echo "=== Vermagic ==="
          strings out/net/ipv4/tcp_bbr.ko | grep vermagic
          BUILD_DATE=$(date +%Y%m%d-%H%M)
          mkdir -p magisk/META-INF/com/google/android magisk/module
          cp out/net/ipv4/tcp_bbr.ko magisk/module/
          printf "id=tcp_bbr_extremekrnl\nname=TCP BBR ExtremeKRNL v1.6\nversion=v1.0-${BUILD_DATE}\nversionCode=1\nauthor=hacenbm144\ndescription=BBR for ExtremeKRNL-v1.6 built ${BUILD_DATE}\n" > magisk/module.prop
          printf 'MODDIR=${0%%/*}\ninsmod $MODDIR/module/tcp_bbr.ko && echo bbr > /proc/sys/net/ipv4/tcp_congestion_control && echo fq > /proc/sys/net/core/default_qdisc\n' > magisk/post-fs-data.sh
          printf '#!/sbin/sh\nSKIPUNZIP=1\nunzip -o "$ZIPFILE" -d "$MODPATH"\n' > magisk/META-INF/com/google/android/update-binary
          printf '#MAGISK\n' > magisk/META-INF/com/google/android/updater-script
          cd magisk && zip -r9 ../tcp_bbr.zip . && cd ..
      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: tcp_bbr_module_v1.6
          path: tcp_bbr.zip
          retention-days: 7
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7