name: Build tcp_bbr.ko
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          fetch-depth: 1
      - name: Install dependencies
        run: sudo apt-get update -y && sudo apt-get install -y bc bison build-essential curl flex git libelf-dev libncurses5-dev libssl-dev python3 zip zlib1g-dev
      - name: Setup Clang r584948
        run: |
          mkdir -p $HOME/toolchain/clang
          curl -L "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r584948.tar.gz" -o clang.tar.gz
          if file clang.tar.gz | grep -q gzip; then
            tar -xf clang.tar.gz -C $HOME/toolchain/clang
          else
            echo "AOSP failed, trying backup..."
            curl -L "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/clang+llvm-22.1.0-x86_64-linux-gnu-ubuntu-22.04.tar.xz" -o clang.tar.xz
            tar -xf clang.tar.xz --strip-components=1 -C $HOME/toolchain/clang
          fi
          echo "$HOME/toolchain/clang/bin" >> $GITHUB_PATH
          $HOME/toolchain/clang/bin/clang --version
      - name: Generate config
        run: |
          export PATH="$HOME/toolchain/clang/bin:$PATH"
          make O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- s5e9925_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/b0s.config
          make O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- KBUILD_BUILD_USER=hacenbm144 KBUILD_BUILD_HOST=ExtremeKRNL-b0s olddefconfig
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> out/.config
          echo "CONFIG_TCP_CONG_BBR=m" >> out/.config
          echo "CONFIG_MODULES=y" >> out/.config
          echo "CONFIG_MODULE_UNLOAD=y" >> out/.config
          echo "CONFIG_NET_SCH_FQ=y" >> out/.config
          echo "CONFIG_NET_SCH_FQ_CODEL=y" >> out/.config
          make O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- KBUILD_BUILD_USER=hacenbm144 KBUILD_BUILD_HOST=ExtremeKRNL-b0s olddefconfig
          echo "=== FINAL BBR config check ==="
          grep -E "TCP_CONG_BBR|TCP_CONG_ADVANCED|^CONFIG_MODULES=" out/.config
      - name: Build modules
        run: |
          export PATH="$HOME/toolchain/clang/bin:$PATH"
          make O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- KBUILD_BUILD_USER=hacenbm144 KBUILD_BUILD_HOST=ExtremeKRNL-b0s -j$(nproc --all) modules 2>&1 | tee build.log
      - name: Check and package
        run: |
          find out -name "tcp_bbr.ko" 2>/dev/null
          if [ ! -f out/net/ipv4/tcp_bbr.ko ]; then echo "FAILED"; tail -50 build.log; exit 1; fi
          echo "SUCCESS"
          ls -lh out/net/ipv4/tcp_bbr.ko
          strings out/net/ipv4/tcp_bbr.ko | grep vermagic
          mkdir -p magisk/META-INF/com/google/android magisk/module
          cp out/net/ipv4/tcp_bbr.ko magisk/module/
          printf 'id=tcp_bbr_extremekrnl\nname=TCP BBR ExtremeKRNL\nversion=v1.0\nversionCode=1\nauthor=hacenbm144\ndescription=BBR for ExtremeKRNL-Quant-v2\n' > magisk/module.prop
          printf 'MODDIR=${0%%/*}\ninsmod $MODDIR/module/tcp_bbr.ko && echo bbr > /proc/sys/net/ipv4/tcp_congestion_control && echo fq > /proc/sys/net/core/default_qdisc\n' > magisk/post-fs-data.sh
          printf '#!/sbin/sh\nSKIPUNZIP=1\nunzip -o "$ZIPFILE" -d "$MODPATH"\n' > magisk/META-INF/com/google/android/update-binary
          printf '#MAGISK\n' > magisk/META-INF/com/google/android/updater-script
          cd magisk && zip -r9 ../tcp_bbr.zip . && cd ..
      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: tcp_bbr_module
          path: tcp_bbr.zip
          retention-days: 7
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7