name: Build tcp_bbr.ko

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential curl flex \
            git libelf-dev libncurses5-dev libssl-dev \
            python3 zip zlib1g-dev

      - name: Setup Clang toolchain
        run: |
          mkdir -p $HOME/toolchain/clang
          curl -L \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz" \
            -o clang.tar.xz
          tar -xf clang.tar.xz --strip-components=1 -C $HOME/toolchain/clang
          echo "$HOME/toolchain/clang/bin" >> $GITHUB_PATH
          $HOME/toolchain/clang/bin/clang --version

      - name: Generate kernel config
        run: |
          export PATH="$HOME/toolchain/clang/bin:$PATH"
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            s5e9925_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out \
            out/.config \
            arch/arm64/configs/b0s.config
          echo "CONFIG_TCP_CONG_BBR=m" >> out/.config
          echo "CONFIG_MODULES=y" >> out/.config
          echo "CONFIG_MODULE_UNLOAD=y" >> out/.config
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KBUILD_BUILD_USER=hacenbm144 \
            KBUILD_BUILD_HOST=ExtremeKRNL-b0s \
            olddefconfig
          grep "TCP_CONG_BBR\|CONFIG_MODULES\|MODULE_UNLOAD" out/.config

      - name: Prepare module build environment
        run: |
          export PATH="$HOME/toolchain/clang/bin:$PATH"
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KBUILD_BUILD_USER=hacenbm144 \
            KBUILD_BUILD_HOST=ExtremeKRNL-b0s \
            -j$(nproc --all) \
            modules_prepare

      - name: Build tcp_bbr.ko
        run: |
          export PATH="$HOME/toolchain/clang/bin:$PATH"
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KBUILD_BUILD_USER=hacenbm144 \
            KBUILD_BUILD_HOST=ExtremeKRNL-b0s \
            -j$(nproc --all) \
            M=net/ipv4 \
            net/ipv4/tcp_bbr.ko 2>&1 | tee build.log

      - name: Check output
        run: |
          if [ -f out/net/ipv4/tcp_bbr.ko ]; then
            echo "✅ tcp_bbr.ko built successfully!"
            ls -lh out/net/ipv4/tcp_bbr.ko
            strings out/net/ipv4/tcp_bbr.ko | grep vermagic
          else
            echo "❌ Build failed"
            ls out/net/ipv4/*.ko 2>/dev/null || echo "No .ko files"
            tail -30 build.log
            exit 1
          fi

      - name: Package as Magisk module
        run: |
          mkdir -p magisk_module/META-INF/com/google/android
          mkdir -p magisk_module/module
          cp out/net/ipv4/tcp_bbr.ko magisk_module/module/
          cat > magisk_module/module.prop << 'EOF'
id=tcp_bbr_extremekrnl
name=TCP BBR for ExtremeKRNL-Quant-v2
version=v1.0
versionCode=1
author=hacenbm144
description=Adds BBR TCP congestion control to ExtremeKRNL-Quant-v2 (5.10.246)
EOF
          cat > magisk_module/post-fs-data.sh << 'EOF'
MODDIR=${0%/*}
ORIG_DESC=$(grep -m1 -E '^description=' ${MODDIR}/module.prop | cut -d'=' -f2)
grep -vE '^description=' ${MODDIR}/module.prop > ${MODDIR}/module.prop.tmp
mv ${MODDIR}/module.prop.tmp ${MODDIR}/module.prop
if cat /proc/sys/net/ipv4/tcp_available_congestion_control | grep -q 'bbr'; then
  desc="[OK BBR already available] $ORIG_DESC"
elif insmod ${MODDIR}/module/tcp_bbr.ko; then
  desc="[OK tcp_bbr.ko loaded] $ORIG_DESC"
  echo 'bbr' > /proc/sys/net/ipv4/tcp_congestion_control
  echo 'fq' > /proc/sys/net/core/default_qdisc
else
  desc="[FAIL tcp_bbr.ko failed to load] $ORIG_DESC"
fi
echo "description=${desc}" >> ${MODDIR}/module.prop
sync
EOF
          cat > magisk_module/service.sh << 'EOF'
sleep 10
if cat /proc/sys/net/ipv4/tcp_available_congestion_control | grep -q 'bbr'; then
  echo 'bbr' > /proc/sys/net/ipv4/tcp_congestion_control
  echo 'fq' > /proc/sys/net/core/default_qdisc
fi
EOF
          cat > magisk_module/META-INF/com/google/android/update-binary << 'EOF'
#!/sbin/sh
SKIPUNZIP=1
unzip -o "$ZIPFILE" 'module/*' -d "$MODPATH"
unzip -o "$ZIPFILE" 'module.prop' -d "$MODPATH"
unzip -o "$ZIPFILE" 'post-fs-data.sh' -d "$MODPATH"
unzip -o "$ZIPFILE" 'service.sh' -d "$MODPATH"
set_perm_recursive "$MODPATH" root root 0755 0644
EOF
          echo "#MAGISK" > magisk_module/META-INF/com/google/android/updater-script
          cd magisk_module
          zip -r9 ../tcp_bbr_ExtremeKRNL.zip . -x '*.git*'
          cd ..
          ls -lh tcp_bbr_ExtremeKRNL.zip

      - name: Upload tcp_bbr.ko
        uses: actions/upload-artifact@v4
        with:
          name: tcp_bbr_ko
          path: out/net/ipv4/tcp_bbr.ko
          retention-days: 7

      - name: Upload Magisk module
        uses: actions/upload-artifact@v4
        with:
          name: tcp_bbr_magisk_module
          path: tcp_bbr_ExtremeKRNL.zip
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7